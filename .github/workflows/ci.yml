name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dart:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          cache: true
      - run: flutter pub get
      - run: dart format -l 120 --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts

  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # A fresh database from every migration, the way a new self-hoster gets one.
      - run: supabase db start
      - run: supabase db lint --level error
