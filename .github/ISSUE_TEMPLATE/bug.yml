name: Bug
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      multiple: true
      options: [Mac app, iPhone app, Widget / Siri, Backend setup, Quick questions (AI), Terminal from iPhone]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Džep version (Mac → Džep → About), macOS / iOS version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Errors or logs
      description: Any message the app showed. Leave out your project URL and keys.
