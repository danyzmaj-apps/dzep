name: ideja
description: "Ideja: a hotkey idea inbox for macOS, synced through Supabase."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^7.2.2
  crypto: ^3.0.7
  flutter:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.0
  url_launcher: ^6.3.3
  uuid: ^4.6.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

# `swift tool/make_icon.swift && fvm dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/icon/ios.png
  ios: true
  remove_alpha_ios: true
  android: false
  macos:
    generate: true
    image_path: assets/icon/macos.png
