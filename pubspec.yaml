name: dzep_workspace
description: "Džep: the workspace of the Mac app, the phone app and the code they share."
publish_to: 'none'

environment:
  sdk: ^3.13.4

workspace:
  - packages/dzep_core
  - apps/dzep-macos-app
  - apps/dzep-mobile

# The shared analysis_options.yaml includes very_good_analysis.
dev_dependencies:
  very_good_analysis: ^11.0.0
