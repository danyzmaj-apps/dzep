# Notes tab: write a note (the first line becomes its title), find it in the
# list with its second line as the preview, reopen and edit it, delete it with
# a swipe. Needs a signed-in session.
appId: com.danyzmaj.dzep
---
- launchApp
- extendedWaitUntil:
    visible: "Todos.*"
    timeout: 15000
- tapOn: "Notes.*"
- tapOn: "New note"
- inputText: "Maestro note ${TS}\nsecond line"
- tapOn: "Back"
# A row reads as one label: title, preview, time.
- extendedWaitUntil:
    visible: "Maestro note ${TS}.*second line.*"
    timeout: 5000
# Reopen and add a line: it saves as it's typed.
- tapOn: "Maestro note ${TS}.*"
- tapOn: "Maestro note ${TS}.*"
- inputText: "\nthird line"
- tapOn: "Back"
- tapOn: "Maestro note ${TS}.*"
- assertVisible: ".*third line.*"
- tapOn: "Back"
# Swipe left deletes, with Undo. The newest note is the top row.
- swipe:
    start: 90%, 25%
    end: 5%, 25%
    duration: 400
- extendedWaitUntil:
    visible: "Note deleted"
    timeout: 5000
- assertNotVisible: "Maestro note ${TS}.*"
