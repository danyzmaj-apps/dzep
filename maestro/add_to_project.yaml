# Signed-in iPhone app: on the Ideas tab, add an idea with the + button, put
# it under a project from its detail page, then find it under that project's
# filter chip. Needs a signed-in session.
# Run: maestro test -e TS=$(date +%H%M%S) maestro/
appId: com.danyzmaj.dzep
---
- launchApp
- extendedWaitUntil:
    visible: "Ideas.*"
    timeout: 15000
- tapOn: "Ideas.*"
- tapOn: "New idea"
- tapOn: "Drop an idea.*"
- inputText: "Maestro idea ${TS}"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Maestro idea ${TS}.*"
    timeout: 5000
- tapOn: "Maestro idea ${TS}.*"
- extendedWaitUntil:
    visible: "Description: context.*"
    timeout: 5000
- tapOn: "project"
- inputText: "maestro${TS}"
- tapOn: "Back"
# Project chips sit in a horizontal row, sorted; earlier runs' projects may
# push this one off-screen.
- scrollUntilVisible:
    element: "@maestro${TS}"
    direction: RIGHT
    centerElement: true
- tapOn: "@maestro${TS}"
- assertVisible: "Maestro idea ${TS}.*"
- assertVisible: "\\d\\d:\\d\\d"
