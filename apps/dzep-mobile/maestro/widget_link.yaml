# The widgets' tap targets: dzep://add opens the Pocket tab's add sheet as an
# idea, dzep://add?kind=todo as a todo; each save lands in the list.
appId: com.danyzmaj.dzep
---
- tapOn:
    text: "Cancel"
    optional: true
- launchApp
- extendedWaitUntil:
    visible: "(\\d+\n)?Pocket(\nTab.*)?"
    timeout: 15000
- openLink: "dzep://add?kind=todo"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Add a todo.*"
    timeout: 5000
- tapOn: "Add a todo.*"
- inputText: "From the todo widget ${TS}"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "From the todo widget ${TS}.*"
    timeout: 5000
- openLink: "dzep://add"
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible: "Drop an idea.*"
    timeout: 5000
- tapOn: "Drop an idea.*"
- inputText: "From the widget ${TS}"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "From the widget ${TS}.*"
    timeout: 5000
- assertNotVisible: "Save"
