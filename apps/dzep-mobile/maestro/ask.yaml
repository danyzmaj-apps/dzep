# Ask tab: start a chat, get a streamed answer through the `ask` edge
# function, follow up in the same chat, copy the last answer, find the chat
# in the list, delete it. Needs a signed-in session and the network.
appId: com.danyzmaj.dzep
---
- launchApp
- extendedWaitUntil:
    visible: "Pocket"
    timeout: 15000
- tapOn: "Ask"
- tapOn: "New"
# The field (its hint), not the "Ask a quick question below." empty state.
- tapOn: "Ask a quick question…"
- inputText: "Reply with exactly the word PONG${TS} and nothing else"
- tapOn: "Send"
# An answer and its Copy button read as one accessibility node.
- extendedWaitUntil:
    visible: "PONG${TS}(\nCopy)?"
    timeout: 45000
- tapOn: "Follow up.*"
- inputText: "Now reply with exactly the word PING${TS} and nothing else"
- tapOn: "Send"
- extendedWaitUntil:
    visible: "PING${TS}(\nCopy)?"
    timeout: 45000
- tapOn: "Copy last answer"
- assertVisible: "Copied ✓"
# iOS has no system back: the app bar's Back button.
- hideKeyboard
- tapOn: "Back"
- extendedWaitUntil:
    visible: "New chat"
    timeout: 5000
- extendedWaitUntil:
    visible: ".*PONG${TS}.*"
    timeout: 5000
# Newest first: the new chat is the top row. Swipe it away right to left
# across the screen (an element swipe is too short for Dismissible).
- swipe:
    start: 85%, 18%
    end: 5%, 18%
    duration: 400
- assertVisible: "Chat deleted"
- extendedWaitUntil:
    notVisible: ".*PONG${TS}.*"
    timeout: 5000
