# Pocket tab, Ideas: add an idea with the + button, put it under a project
# from its detail page, then find it under that project's filter pill. Needs
# a signed-in session.
# Run: maestro test -e TS=$(date +%H%M%S) maestro/
appId: com.danyzmaj.dzep
---
- launchApp
- extendedWaitUntil:
    visible: "Pocket"
    timeout: 15000
- tapOn: "Pocket"
- waitForAnimationToEnd
- tapOn: "Ideas"
- tapOn: "New"
- tapOn: "Drop an idea.*"
- inputText: "Maestro idea ${TS}"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Maestro idea ${TS}.*"
    timeout: 5000
- tapOn: "Maestro idea ${TS}.*"
- extendedWaitUntil:
    visible: "Description: context.*"
    timeout: 5000
- tapOn: "project"
- inputText: "maestro${TS}"
- tapOn: "Back"
# Project chips sit in a horizontal row, sorted; earlier runs' projects push
# this one off-screen. Swipe that row itself (scrollUntilVisible swipes the
# middle of the screen, which is the list).
- repeat:
    while:
      notVisible: "@maestro${TS}"
    times: 15
    commands:
      - swipe:
          start: 85%, 24%
          end: 15%, 24%
          duration: 300
- tapOn: "@maestro${TS}"
- assertVisible: "Maestro idea ${TS}.*"
- assertVisible: "\\d\\d:\\d\\d"
