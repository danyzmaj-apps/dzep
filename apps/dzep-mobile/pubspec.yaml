name: dzep_mobile
description: "Džep for iPhone and Android: your ideas, todos, notes and the Mac's coding sessions, synced through your own Supabase."
publish_to: 'none'
version: 0.4.0+4
resolution: workspace

environment:
  sdk: ^3.13.4

dependencies:
  app_links: ^7.2.2
  crypto: ^3.0.7
  dzep_core: any
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  supabase_flutter: ^2.18.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

# `swift tool/make_icon.swift` (run in apps/dzep-macos-app), then `fvm dart run flutter_launcher_icons`
flutter_launcher_icons:
  image_path: assets/icon/ios.png
  ios: true
  remove_alpha_ios: true
  android: true
  # Android 8+: the gradient behind, the pocket in front, shaped by the launcher's mask.
  adaptive_icon_background: assets/icon/android-background.png
  adaptive_icon_foreground: assets/icon/android-foreground.png
  adaptive_icon_foreground_inset: 0
